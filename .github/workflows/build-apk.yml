name: Build Aviator Predictor APK

on:
  push:
    branches:
      - principal
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Extraire le projet Android
        run: |
          mkdir -p extracted
          unzip -q *.zip -d extracted

      - name: Compiler l'APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name gradlew -type f | head -1)")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: AviatorPredictorPro-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
